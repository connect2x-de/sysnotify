[versions]
sysnotify = "1.8.0"
jvmTarget = "17"
android-minSdk = "28"
android-compileSdk = "34"
agp = "8.7.3" # https://developer.android.com/build/releases/gradle-plugin
kotlin = "2.1.10" # https://github.com/JetBrains/kotlin/releases
kotlinx-coroutines = "1.10.1" # https://github.com/Kotlin/kotlinx.coroutines/releases
core = "1.15.0" # https://developer.android.com/jetpack/androidx/releases/core
stately = "2.1.0" # https://github.com/touchlab/Stately/releases

# For sample
compose = "1.7.3" # https://github.com/JetBrains/compose-multiplatform/releases
androidx-activityCompose = "1.9.3" # https://developer.android.com/jetpack/androidx/releases/activity
androidx-ui-tooling = "1.7.6" # https://developer.android.com/jetpack/androidx/releases/compose-ui

kmpJni = "1.0.1" # https://gitlab.com/connect2x/kmp-jni/-/packages
sysnotifyBinaries = "v1.1.2" # https://gitlab.com/connect2x/sysnotify-platform-binaries/-/packages/

[libraries]
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
kmpJni = { module = "de.connect2x:kmp-jni", version.ref = "kmpJni" }
stately-common = { module = "co.touchlab:stately-common", version.ref = "stately" }
stately-collections = { module = "co.touchlab:stately-collections", version.ref = "stately" }

# For sample
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-ui-tooling" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }

# For sample
androidApplication = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
