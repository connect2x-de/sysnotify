[versions]
jvmTarget = "17"
android-minSdk = "28"
android-compileSdk = "34"
agp = "8.5.2"
kotlin = "2.0.10"
kotlinx-coroutines = "1.9.0" # https://github.com/Kotlin/kotlinx.coroutines/releases
core = "1.15.0" # https://mvnrepository.com/artifact/androidx.core/core
uuid = "0.8.4" # https://github.com/benasher44/uuid/releases
# For sample
androidx-activityCompose = "1.9.3" # https://mvnrepository.com/artifact/androidx.activity/activity-compose
androidx-ui-tooling = "1.7.5" # https://mvnrepository.com/artifact/androidx.compose.ui/ui-tooling
compose-plugin = "1.7.0" # https://github.com/JetBrains/compose-multiplatform/releases

multiplatformJni = "1.7.1.46"
gradleCMake = "1.1.0.28"

[libraries]
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
uuid = { module = "com.benasher44:uuid", version.ref = "uuid" }
# For sample
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-ui-tooling" }

multiplatformJni = { module = "io.karma.jni:multiplatform-jni", version.ref = "multiplatformJni" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# For sample
androidApplication = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

gradleCMake = { id = "io.karma.gradlecm.gradle-cmake", version.ref = "gradleCMake" }
