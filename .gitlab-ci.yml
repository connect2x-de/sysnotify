workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
  - build
  # - test
  - security
  - publish

variables:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  KONAN_DATA_DIR: $CI_PROJECT_DIR/.konan
  BUILD_LINUX_IMAGE_NAME: registry.gitlab.com/trixnity/trixnity/trixnity-build-linux:latest

.cache-linux: &cache-linux
  - key: global-sysnotify-cache-linux
    policy: pull-push
    paths:
      - $GRADLE_USER_HOME
      - $KONAN_DATA_DIR
  - key: "$CI_COMMIT_REF_NAME-linux"
    policy: push
    paths:
      - $GRADLE_USER_HOME
      - $KONAN_DATA_DIR

.pull-cache-linux: &pull-cache-linux
  - key: "$CI_COMMIT_REF_NAME-linux"
    fallback_keys: [ "global-sysnotify-cache-linux" ]
    policy: pull
    paths:
      - $GRADLE_USER_HOME
      - $KONAN_DATA_DIR

.cache-mac: &cache-mac
  - key: global-sysnotify-cache-mac
    policy: pull-push
    paths:
      - $GRADLE_USER_HOME
      - $KONAN_DATA_DIR
  - key: "$CI_COMMIT_REF_NAME-mac"
    policy: push
    paths:
      - $GRADLE_USER_HOME
      - $KONAN_DATA_DIR

.pull-cache-mac: &pull-cache-mac
  - key: "$CI_COMMIT_REF_NAME-mac"
    fallback_keys: [ "global-sysnotify-cache-mac" ]
    policy: pull
    paths:
      - $GRADLE_USER_HOME
      - $KONAN_DATA_DIR

.cache-windows: &cache-windows
  - key: global-sysnotify-cache-windows
    policy: pull-push
    paths:
      - $GRADLE_USER_HOME
      - $KONAN_DATA_DIR
  - key: "$CI_COMMIT_REF_NAME-windows"
    policy: push
    paths:
      - $GRADLE_USER_HOME
      - $KONAN_DATA_DIR

.pull-cache-windows: &pull-cache-windows
  - key: "$CI_COMMIT_REF_NAME-windows"
    fallback_keys: [ "global-sysnotify-cache-windows" ]
    policy: pull
    paths:
      - $GRADLE_USER_HOME
      - $KONAN_DATA_DIR

.artifact-reports: &artifact-reports
  name: reports
  when: always
  paths: [ "**/build/reports" ]
  reports:
    junit: "**/build/test-results/**/TEST-*.xml"

.if-merge-request-or-main: &if-merge-request-or-main
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never

.if-main: &if-main
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never

.if-release: &if-release
  - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+.*/'
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never

build:windows:
  stage: build
  interruptible: true
  tags: [ "saas-windows-medium-amd64" ]
  cache:
    - *cache-windows
  rules:
    - *if-merge-request-or-main
  script:
    - ./gradlew
      compileKotlinMingwX64
      linkMingwX64
      nativesJar
      --stacktrace

build:mac:
  stage: build
  interruptible: true
  tags: [ "connect2x-mac" ]
  cache:
    - *cache-mac
  rules:
    - *if-merge-request-or-main
  script:
    - ./gradlew
      compileKotlin{MacosX64,MacosArm64,IosArm64,IosSimulatorArm64,IosX64}
      link{MacosX64,MacosArm64,IosArm64,IosX64}
      nativesJar
      --stacktrace

build:linux:
  stage: build
  interruptible: true
  tags: [ "saas-linux-small-amd64" ]
  image: $BUILD_LINUX_IMAGE_NAME
  cache:
    - *cache-linux
  rules:
    - *if-merge-request-or-main
  script:
    - apt update -y
    - DEBIAN_FRONTEND=noninteractive apt install keyboard-configuration
    - apt install libnotify-bin libnotify-dev -y
    - ./gradlew
      compileKotlin{Jvm,LinuxX64}
      compileReleaseKotlinAndroid
      linkLinuxX64
      nativesJar
      --stacktrace

security:dependencies:
  stage: security
  interruptible: true
  timeout: 30m
  needs: [ ]
  tags: [ "saas-linux-small-amd64" ]
  image:
    name: "aquasec/trivy"
    entrypoint: [ "" ]
  variables:
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    paths:
      - .trivycache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true
    - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+.*/'
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "schedule"
      allow_failure: false
  artifacts:
    when: always
    reports:
      dependency_scanning: report.json
  script:
    - trivy repo ./ --exit-code 0
    - trivy repo ./ --exit-code 0 --format template --template "@/contrib/gitlab.tpl" --output report.json
    - trivy repo ./ --exit-code 1 --severity CRITICAL

publish:mac:
  stage: publish
  tags: [ "connect2x-mac" ]
  cache:
    - *pull-cache-mac
  rules:
    - *if-main
    - *if-release
  script:
    - ./gradlew
      publish{MacosX64,MacosArm64,IosArm64,IosSimulatorArm64,IosX64,NativesJar}PublicationToGitlabRepository
      --stacktrace

publish:linux:
  stage: publish
  tags: [ "saas-linux-small-amd64" ]
  image: $BUILD_LINUX_IMAGE_NAME
  cache:
    - *pull-cache-linux
  rules:
    - *if-main
    - *if-release
  script:
    - apt update -y
    - DEBIAN_FRONTEND=noninteractive apt install keyboard-configuration
    - apt install libnotify-bin libnotify-dev -y
    - ./gradlew
      publish{KotlinMultiplatform,Jvm,Js,AndroidRelease}PublicationToGitlabRepository
      --stacktrace

publish:windows:
  stage: publish
  tags: [ "saas-windows-medium-amd64" ]
  cache:
    - *pull-cache-windows
  rules:
    - *if-main
    - *if-release
  script:
    - gradlew
      publish{MingwX64,NativesJar}PublicationToGitlabRepository
      --stacktrace
