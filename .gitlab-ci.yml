workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
  - build
  - check
  - test
  - publish

variables:
  SYSNOTIFY_DEBUG: 1

.artifact-reports: &artifact-reports
  name: reports
  when: always
  paths: [ "**/build/reports", "**/build/kotlin/abi-legacy" ]
  reports:
    junit: "**/build/test-results/**/TEST-*.xml"

.if-merge-request: &if-merge-request
  - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never

.if-dev-release: &if-dev-release
  - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+.*/'
    when: never
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: '$CI_COMMIT_BRANCH =~ /^v-\d+.\d+.\d+.*/'

.if-release: &if-release
  - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+.*/'
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never

build:windows:
  stage: build
  interruptible: true
  tags: [ "connect2x-win" ]
  rules:
    - *if-merge-request
  variables:
    # Without this, GitLab autoscaler never completes the build after Gradle finishes,
    # since the Gradle daemon is seen as a child process of the builds parent process.
    GRADLE_OPTS: -Dorg.gradle.daemon=false
  script:
    - ./gradlew
      :sysnotify-core:clean
      :sysnotify-core:linkMingwX64
      :sysnotify-core:mingwX64Test

build:mac:
  stage: build
  interruptible: true
  tags: [ "connect2x-mac" ]
  rules:
    - *if-merge-request
  script:
    - ./gradlew
      :sysnotify-core:clean
      :sysnotify-core:link{MacosArm64,IosArm64,IosSimulatorArm64}

build:linux:
  stage: build
  interruptible: true
  tags: [ "connect2x-linux-shell" ]
  rules:
    - *if-merge-request
  script:
    - ./gradlew
      :sysnotify-core:compile{ReleaseKotlinAndroid,KotlinJvm}
      :sysnotify-core:linkLinux{X64,Arm64}
      :sysnotify-core:{linuxX64,jvm}Test

test:apple:
  stage: test
  interruptible: true
  tags: [ "connect2x-mac-arm" ]
  rules:
    - *if-merge-request
  script:
    - ./gradlew
      :sysnotify-core:{macosArm64,iosSimulatorArm64}Test

# Only required on macOS since it can build all targets
check:abi:
  stage: check
  interruptible: true
  timeout: 1h
  needs: [ "build:mac" ]
  tags: [ "connect2x-mac" ]
  artifacts: *artifact-reports
  rules:
    - *if-merge-request
  script:
    - ./gradlew :sysnotify-core:clean :sysnotify-core:checkLegacyAbi

check:vulnerable-dependencies:
  stage: check
  interruptible: true
  timeout: 30m
  needs: [ ]
  tags: [ "connect2x-linux-shell-small" ]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true
    - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+.*/'
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "schedule"
      allow_failure: false
  variables:
    WITH_LOCK: true
  artifacts:
    when: always
    reports:
      dependency_scanning: report.json
  script:
    - ./gradlew dependenciesForAll --write-locks > dependencies.txt
    - trivy repo ./ --exit-code 0 --ignorefile .trivyignore.yaml
    - trivy repo ./ --exit-code 0 --ignorefile .trivyignore.yaml --format template --template "@/usr/local/share/trivy/templates/gitlab.tpl" --output report.json
    - trivy repo ./ --exit-code 1 --ignorefile .trivyignore.yaml --severity CRITICAL

publish:dev:
  stage: publish
  tags: [ "connect2x-mac" ]
  timeout: 2h
  rules:
    - *if-dev-release
  script:
    - ./gradlew
      publishAllPublicationsToGitLabRepository
      --stacktrace

publish:release:
  stage: publish
  tags: [ "connect2x-mac" ]
  timeout: 2h
  rules:
    - *if-release
  script:
    - ./gradlew
      publishAllPublicationsToGitLabRepository
      publishAndReleaseToMavenCentral
      --stacktrace
