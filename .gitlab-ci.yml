workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages:
  - build
  - test
  - security
  - publish

variables:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  KONAN_DATA_DIR: $CI_PROJECT_DIR/.konan
  BUILD_LINUX_IMAGE_NAME: registry.gitlab.com/trixnity/kmp-dockerfiles/kmp-dockerfiles-base:latest
  LINUX_DEPENDENCIES: >
    libglib2.0-0 libgdk-pixbuf-2.0-0 libnotify4 libnotify-bin libx11-6
  SYSNOTIFY_DEBUG: 1

.artifact-reports: &artifact-reports
  name: reports
  when: always
  paths: [ "**/build/reports", "**/build/kotlin/abi-legacy" ]
  reports:
    junit: "**/build/test-results/**/TEST-*.xml"

.if-merge-request: &if-merge-request
  - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never

.if-main: &if-main
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never

.if-release: &if-release
  - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+.*/'
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never

build:windows:
  stage: build
  interruptible: true
  timeout: 2h
  tags: [ "saas-windows-medium-amd64" ]
  rules:
    - *if-merge-request
  script:
    - ./gradlew 
      :sysnotify:linkMingwX64 
      :sysnotify:mingwX64Test

build:mac:
  stage: build
  interruptible: true
  tags: [ "connect2x-mac" ]
  rules:
    - *if-merge-request
  script:
    - ./gradlew
      :sysnotify:link{MacosX64,MacosArm64,IosArm64,IosX64,IosSimulatorArm64}
      :sysnotify:{macosX64,iosX64}Test

build:linux:
  stage: build
  interruptible: true
  tags: [ "connect2x-linux" ]
  image: $BUILD_LINUX_IMAGE_NAME
  rules:
    - *if-merge-request
  before_script:
    - apt update -y
    - apt install -y $LINUX_DEPENDENCIES
  script:
    - ./gradlew
      :sysnotify:compile{ReleaseKotlinAndroid,KotlinJvm}
      :sysnotify:linkLinux{X64,Arm64}
      :sysnotify:{linuxX64,jvm}Test

# Only required on macOS since it can build all targets
checkAbi:
  stage: test
  interruptible: true
  timeout: 1h
  needs: [ "build:mac" ]
  tags: [ "connect2x-mac" ]
  artifacts: *artifact-reports
  rules:
    - *if-merge-request
  script:
    - ./gradlew :sysnotify:checkLegacyAbi

security:dependencies:
  stage: security
  interruptible: true
  timeout: 30m
  needs: [ ]
  tags: [ "connect2x-linux" ]
  image:
    name: "aquasec/trivy"
    entrypoint: [ "" ]
  variables:
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    paths:
      - .trivycache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true
    - if: '$CI_COMMIT_TAG =~ /^v\d+.\d+.\d+.*/'
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "schedule"
      allow_failure: false
  artifacts:
    when: always
    reports:
      dependency_scanning: report.json
  script:
    - trivy repo ./ --exit-code 0
    - trivy repo ./ --exit-code 0 --format template --template "@/contrib/gitlab.tpl" --output report.json
    - trivy repo ./ --exit-code 1 --severity CRITICAL

publish:mac:
  stage: publish
  tags: [ "connect2x-mac" ]
  rules:
    - *if-main
    - *if-release
  script:
    - ./gradlew :sysnotify:publish{MacosX64,MacosArm64,IosArm64,IosSimulatorArm64,IosX64,Jvm}PublicationToGitlabRepository

publish:linux:
  stage: publish
  tags: [ "connect2x-linux" ]
  image: $BUILD_LINUX_IMAGE_NAME
  rules:
    - *if-main
    - *if-release
  before_script:
    - apt update -y
    - apt install -y $LINUX_DEPENDENCIES
  script:
    - ./gradlew :sysnotify:publish{KotlinMultiplatform,Js,AndroidRelease}PublicationToGitlabRepository

publish:windows:
  stage: publish
  timeout: 2h
  tags: [ "saas-windows-medium-amd64" ]
  rules:
    - *if-main
    - *if-release
  script:
    - ./gradlew :sysnotify:publishMingwX64PublicationToGitlabRepository
